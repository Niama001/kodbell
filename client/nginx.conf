server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Forward API calls to the Express container
  location /api/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # React Router: any other URL should load index.html
  location / {
    try_files $uri /index.html;
  }
}