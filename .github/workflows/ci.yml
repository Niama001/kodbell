name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check syntax of all server files
        run: |
          for f in server.js routes/*.js middleware/*.js db/*.js; do
            node --check "$f"
          done

      - name: Run tests
        run: npm test

      - name: Smoke test - start server and call health endpoint
        run: |
          PORT=4010 node server.js &
          sleep 3
          curl --fail http://localhost:4010/api/health

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Start the full stack
        run: docker compose up -d

      - name: Smoke test - wait for the app, then check API and database
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/api/health > /dev/null &&
               curl --fail --silent http://localhost:8080/api/mentors/topics | grep -q "Data Structures"; then
              echo "App is up and the database is seeded"
              exit 0
            fi
            echo "Waiting for the app... ($i/30)"
            sleep 2
          done
          echo "App did not become healthy in time"
          exit 1

      - name: Show container logs if something failed
        if: failure()
        run: docker compose logs

      - name: Shut down
        if: always()
        run: docker compose down -v